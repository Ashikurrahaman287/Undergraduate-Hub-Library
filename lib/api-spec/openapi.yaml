openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Undergraduate Hub library and book exchange API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: library
    description: Member library operations
  - name: admin
    description: Staff operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Sign in an administrator through Supabase Auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginInput" }
      responses:
        "200":
          description: Authenticated admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuthSession" }
        "401": { description: Invalid credentials }
        "403": { description: Authenticated account is not an administrator }
        "503": { description: Admin authentication is not configured }
  /auth/admin/session:
    get:
      operationId: getAdminSession
      tags: [auth]
      summary: Get the current administrator session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuthSession" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Session ended }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [library]
      summary: Get the member dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /books:
    get:
      operationId: listBooks
      tags: [library]
      summary: Browse books
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
        - name: sort
          in: query
          schema: { type: string, enum: [title, recent, popular] }
      responses:
        "200":
          description: Books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
    post:
      operationId: createBook
      tags: [admin]
      summary: Add a book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "201":
          description: Created book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
  /books/{id}:
    get:
      operationId: getBook
      tags: [library]
      summary: Get book details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { description: Book not found }
    patch:
      operationId: updateBook
      tags: [admin]
      summary: Update a book
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookUpdate" }
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
  /requests:
    get:
      operationId: listBorrowRequests
      tags: [library]
      summary: List borrow requests
      responses:
        "200":
          description: Borrow requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BorrowRequest" }
    post:
      operationId: createBorrowRequest
      tags: [library]
      summary: Request a book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BorrowRequestInput" }
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BorrowRequest" }
  /admin/requests:
    get:
      operationId: listAdminBorrowRequests
      tags: [admin]
      summary: List all borrow requests for authorized staff
      responses:
        "200":
          description: Borrow requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BorrowRequest" }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
  /my-books:
    get:
      operationId: listMyBooks
      tags: [library]
      summary: List the member's current and returned books
      responses:
        "200":
          description: Member books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyBook" }
  /wishlist:
    get:
      operationId: listWishlist
      tags: [library]
      summary: List wishlist books
      responses:
        "200":
          description: Wishlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
    post:
      operationId: addWishlist
      tags: [library]
      summary: Add a book to the wishlist
      requestBody:
        required: true
        content:
          application/json:
              schema: { $ref: "#/components/schemas/WishlistInput" }
      responses:
        "201": { description: Added }
  /wishlist/{bookId}:
    delete:
      operationId: removeWishlist
      tags: [library]
      summary: Remove a book from the wishlist
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed }
  /notifications:
    get:
      operationId: listNotifications
      tags: [library]
      summary: List internal member notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [library]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Marked read }
  /requests/{id}/status:
    patch:
      operationId: updateBorrowRequestStatus
      tags: [admin]
      summary: Approve, reject, or reschedule a request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestStatusUpdate" }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BorrowRequest" }
  /members:
    get:
      operationId: listMembers
      tags: [admin]
      summary: List members
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
    post:
      operationId: createMember
      tags: [admin]
      summary: Create a member with the current default subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /members/{id}:
    patch:
      operationId: updateMember
      tags: [admin]
      summary: Update member status or override subscription plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /payments:
    get:
      operationId: listPayments
      tags: [admin]
      summary: List offline payments
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
    post:
      operationId: recordPayment
      tags: [admin]
      summary: Record a cash, bKash, or Nagad payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /analytics:
    get:
      operationId: getAnalytics
      tags: [admin]
      summary: Get library analytics
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
components:
  schemas:
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        rememberSession: { type: boolean, default: false }
    AdminAuthSession:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        user:
          type: ["object", "null"]
          properties:
            email: { type: string }
            name: { type: string }
            role: { type: string, enum: [staff, admin, super_admin] }
          required: [email, name, role]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Book:
      type: object
      required: [id, title, author, category, language, status, depositRequired, depositAmount, qrCode]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        category: { type: string }
        language: { type: string }
        coverUrl: { type: ["string", "null"] }
        qrCode: { type: string }
        isbn: { type: ["string", "null"] }
        price: { type: number }
        status: { type: string }
        conditionNote: { type: ["string", "null"] }
        depositRequired: { type: boolean }
        depositAmount: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }
    BookInput:
      type: object
      required: [title, author, category, language]
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string }
        category: { type: string }
        language: { type: string }
        coverUrl: { type: ["string", "null"] }
        isbn: { type: ["string", "null"] }
        price: { type: number, minimum: 0 }
        conditionNote: { type: ["string", "null"] }
        depositRequired: { type: boolean }
        depositAmount: { type: number, minimum: 0 }
    BookUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string }
        category: { type: string }
        language: { type: string }
        price: { type: number, minimum: 0 }
        status: { type: string }
        conditionNote: { type: ["string", "null"] }
        depositRequired: { type: boolean }
        depositAmount: { type: number, minimum: 0 }
    BorrowRequest:
      type: object
      required: [id, bookId, bookTitle, memberName, pickupDate, pickupSlot, status, createdAt, lateFee]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        bookTitle: { type: string }
        memberName: { type: string }
        pickupDate: { type: string }
        pickupSlot: { type: string }
        status: { type: string }
        note: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        lateFee: { type: number }
        memberPhone: { type: ["string", "null"] }
        university: { type: ["string", "null"] }
        depositStatus: { type: ["string", "null"] }
        subscriptionStatus: { type: ["string", "null"] }
        approvedPickupDate: { type: ["string", "null"] }
        approvedPickupTime: { type: ["string", "null"] }
        createdAt: { type: string }
    BorrowRequestInput:
      type: object
      required: [bookId, pickupDate, pickupSlot]
      properties:
        bookId: { type: string, format: uuid }
        pickupDate: { type: string }
        pickupSlot: { type: string }
        note: { type: ["string", "null"] }
    RequestStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        pickupDate: { type: ["string", "null"] }
        pickupSlot: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
    Member:
      type: object
      required: [id, name, email, phone, plan, subscriptionPlan, depositStatus, outstandingFees, status, totalBooksRead]
      properties:
        id: { type: string, format: uuid }
        authUserId: { type: ["string", "null"], format: uuid }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: string }
        university: { type: string }
        studentId: { type: ["string", "null"] }
        plan: { type: string }
        subscriptionPlan: { type: integer, enum: [29, 49] }
        subscriptionStart: { type: ["string", "null"] }
        subscriptionEnd: { type: ["string", "null"] }
        depositAmount: { type: number }
        depositStatus: { type: string }
        outstandingFees: { type: number }
        status: { type: string }
        totalBooksRead: { type: integer }
        joinedAt: { type: string }
    MemberInput:
      type: object
      required: [name, phone, university]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: string, minLength: 7 }
        university: { type: string }
        studentId: { type: ["string", "null"] }
        subscriptionPlan: { type: integer, enum: [29, 49] }
    MemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: string, minLength: 7 }
        university: { type: string }
        studentId: { type: ["string", "null"] }
        subscriptionPlan: { type: integer, enum: [29, 49] }
        subscriptionStart: { type: ["string", "null"] }
        subscriptionEnd: { type: ["string", "null"] }
        depositStatus: { type: string }
        status: { type: string }
    Payment:
      type: object
      required: [id, memberName, amount, method, type, status, paidAt]
      properties:
        id: { type: string, format: uuid }
        memberName: { type: string }
        amount: { type: number }
        method: { type: string }
        type: { type: string }
        status: { type: string }
        reference: { type: ["string", "null"] }
        transactionId: { type: ["string", "null"] }
        paidAt: { type: string }
    PaymentInput:
      type: object
      required: [memberId, amount, method, type]
      properties:
        memberId: { type: string, format: uuid }
        amount: { type: number, minimum: 0 }
        method: { type: string }
        type: { type: string }
        reference: { type: ["string", "null"] }
    WishlistInput:
      type: object
      required: [bookId]
      properties:
        bookId: { type: string, format: uuid }
    MyBook:
      type: object
      required: [transactionId, bookId, title, author, status, lateFee, daysRemaining]
      properties:
        transactionId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        coverUrl: { type: ["string", "null"] }
        borrowDate: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        returnDate: { type: ["string", "null"] }
        status: { type: string }
        lateFee: { type: number }
        daysRemaining: { type: integer }
    Notification:
      type: object
      required: [id, title, message, type, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        type: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string }
    Dashboard:
      type: object
      required: [memberName, activeBook, dueInDays, pendingRequests, wishlistCount, outstandingFees, notifications]
      properties:
        memberName: { type: string }
        activeBook:
          type: ["object", "null"]
          properties:
            title: { type: string }
            author: { type: string }
            dueDate: { type: string }
            daysLeft: { type: integer }
            coverUrl: { type: ["string", "null"] }
          required: [title, author, dueDate, daysLeft]
        dueInDays: { type: integer }
        pendingRequests: { type: integer }
        wishlistCount: { type: integer }
        outstandingFees: { type: number }
        notifications:
          type: array
          items: { type: string }
    Analytics:
      type: object
      required: [totalBooks, availableBooks, borrowedBooks, activeMembers, pendingRequests, monthlyBorrowing]
      properties:
        totalBooks: { type: integer }
        availableBooks: { type: integer }
        borrowedBooks: { type: integer }
        activeMembers: { type: integer }
        pendingRequests: { type: integer }
        monthlyBorrowing:
          type: array
          items:
            type: object
            required: [month, count]
            properties:
              month: { type: string }
              count: { type: integer }

